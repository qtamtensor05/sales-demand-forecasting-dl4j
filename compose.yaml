name: ${COMPOSE_PROJECT_NAME:-sales-demand-forecasting}

x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 3s
  retries: 12
  start_period: 10s

x-spark-worker: &spark-worker
  image: apache/spark:3.5.9-scala2.12-java11-python3-r-ubuntu
  restart: unless-stopped
  depends_on:
    spark-master:
      condition: service_started
  environment:
    SPARK_NO_DAEMONIZE: "true"
    SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-1}
    SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-1g}
  command:
    - /opt/spark/bin/spark-class
    - org.apache.spark.deploy.worker.Worker
    - spark://spark-master:7077
  networks: [forecast-network]
  deploy:
    resources:
      limits:
        memory: 1536M

services:
  minio:
    image: bitnamilegacy/minio:2025.4.22-debian-12-r1
    restart: unless-stopped
    command: server /bitnami/minio/data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-salesadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [forecast-network]
    deploy:
      resources:
        limits:
          memory: 768M

  minio-init:
    image: bitnamilegacy/minio-client:2025.4.16-debian-12-r0
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-salesadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
    entrypoint: [/bin/sh, /bootstrap/init-minio.sh]
    volumes:
      - ./infrastructure/minio/init-minio.sh:/bootstrap/init-minio.sh:ro
      - ./data:/bootstrap/input:ro
      - ${MODEL_ARTIFACT_DIR:-./output/runs/2026-10-13_025422_624_gpu/deployment}:/bootstrap/model:ro
    networks: [forecast-network]

  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sales_forecast}
      POSTGRES_USER: ${POSTGRES_USER:-sales_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U '$${POSTGRES_USER}' -d '$${POSTGRES_DB}'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [forecast-network]
    deploy:
      resources:
        limits:
          memory: 512M

  spark-master:
    image: apache/spark:3.5.9-scala2.12-java11-python3-r-ubuntu
    restart: unless-stopped
    environment:
      SPARK_NO_DAEMONIZE: "true"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
    networks: [forecast-network]
    deploy:
      resources:
        limits:
          memory: 768M

  spark-worker-1:
    <<: *spark-worker
    ports:
      - "${SPARK_WORKER_1_UI_PORT:-8081}:8081"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8081"
      - spark://spark-master:7077

  spark-worker-2:
    <<: *spark-worker
    ports:
      - "${SPARK_WORKER_2_UI_PORT:-8082}:8082"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --webui-port
      - "8082"
      - spark://spark-master:7077

  spark-job-runner:
    image: apache/spark:3.5.9-scala2.12-java11-python3-r-ubuntu
    restart: unless-stopped
    depends_on:
      spark-master:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    entrypoint: [/bin/sh, -c]
    command: ["trap : TERM INT; sleep infinity & wait"]
    volumes:
      - ./spark-etl:/workspace/spark-etl:ro
      - ./data:/workspace/input:ro
    networks: [forecast-network]
    deploy:
      resources:
        limits:
          memory: 768M

  forecast-service:
    build:
      context: .
      dockerfile: infrastructure/forecast-service/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_NAME: forecast-service
      SERVER_PORT: 8083
    ports:
      - "${FORECAST_SERVICE_PORT:-8083}:8083"
    volumes:
      - ${MODEL_ARTIFACT_DIR:-./output/runs/2026-10-13_025422_624_gpu/deployment}:/opt/model:ro
      - ./data:/opt/data:ro
    healthcheck:
      <<: *app-healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8083/health]
    networks: [forecast-network]
    deploy:
      resources:
        limits:
          memory: 2G

  backend-api:
    build:
      context: .
      dockerfile: infrastructure/backend-api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      spark-master:
        condition: service_started
      forecast-service:
        condition: service_healthy
    environment:
      SERVICE_NAME: backend-api
      SERVER_PORT: 8084
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sales_forecast}
      POSTGRES_USER: ${POSTGRES_USER:-sales_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}
      FORECAST_SERVICE_URL: http://forecast-service:8083
      SALES_CSV_PATH: /opt/data/train.csv
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-salesadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-minio-password}
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_SUBMIT: /opt/spark/bin/spark-submit
      SPARK_JOB_JAR: /opt/spark-jobs/spark-etl.jar
      SPARK_TIMEOUT_SECONDS: ${SPARK_TIMEOUT_SECONDS:-600}
    ports:
      - "${BACKEND_API_PORT:-8084}:8084"
    healthcheck:
      <<: *app-healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:8084/api/health]
    volumes:
      - ./data:/opt/data:ro
    networks: [forecast-network]
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    build:
      context: frontend
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      <<: *app-healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
    networks: [forecast-network]
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  forecast-network:
    driver: bridge

volumes:
  minio-data:
  postgres-data:

