server:
  port: ${SERVER_PORT:8084}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sales_forecast}
    username: ${POSTGRES_USER:sales_app}
    password: ${POSTGRES_PASSWORD:change-me-postgres-password}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
forecast:
  service-url: ${FORECAST_SERVICE_URL:http://localhost:8083}
  connect-timeout-ms: ${FORECAST_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${FORECAST_READ_TIMEOUT_MS:30000}
sales:
  csv-path: ${SALES_CSV_PATH:/opt/data/train.csv}
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:salesadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:change-me-minio-password}
ingestion:
  bucket: bronze
  spark-submit: ${SPARK_SUBMIT:/opt/spark/bin/spark-submit}
  spark-master: ${SPARK_MASTER_URL:spark://spark-master:7077}
  spark-jar: ${SPARK_JOB_JAR:/opt/spark-jobs/spark-etl.jar}
  spark-timeout-seconds: ${SPARK_TIMEOUT_SECONDS:600}
spring.servlet.multipart:
  max-file-size: 50MB
  max-request-size: 50MB
springdoc:
  swagger-ui:
    path: /swagger-ui.html
